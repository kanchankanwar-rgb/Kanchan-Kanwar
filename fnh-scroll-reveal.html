<!--
  FNH sitewide scroll-reveal utility.

  Add this once anywhere on the page (e.g. a global "custom code" /
  before-</body> embed). It then animates ANY element on the page marked
  with data-reveal, fading + sliding it up as it scrolls into view — the
  same effect used throughout https://fnhredesign.netlify.app/ for section
  eyebrows, headings, intros and CTA panels.

  Usage:
    <p data-reveal>Standorte</p>
    <h2 data-reveal data-reveal-blur data-reveal-delay="80">FNH in deiner Nähe.</h2>
    <p data-reveal data-reveal-blur data-reveal-delay="140">Intro copy…</p>

  Attributes (all optional except data-reveal itself):
    data-reveal-blur      adds the soft blur-in look used on section headers/CTAs
    data-reveal-y="16"    vertical offset in px the element slides up from (default 26,
                          the reference site uses ~16px for grid/list cards)
    data-reveal-delay="150"  stagger delay in ms before the transition starts
-->
<style>
  :root {
    --fnh-ease-out-quint: cubic-bezier(.22, 1, .36, 1);
  }

  [data-reveal] {
    --reveal-y: 26px;
    --reveal-delay: 0ms;
    opacity: 0;
    transform: translateY(var(--reveal-y));
    transition:
      opacity .9s var(--fnh-ease-out-quint) var(--reveal-delay),
      transform .9s var(--fnh-ease-out-quint) var(--reveal-delay),
      filter .9s var(--fnh-ease-out-quint) var(--reveal-delay);
    will-change: opacity, transform, filter;
  }

  [data-reveal][data-reveal-blur] {
    filter: blur(7px);
  }

  [data-reveal].is-revealed {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
  }

  @media (prefers-reduced-motion: reduce) {
    [data-reveal] {
      transition: none !important;
      opacity: 1 !important;
      transform: none !important;
      filter: none !important;
    }
  }
</style>

<script>
  (function () {
    var elements = Array.prototype.slice.call(document.querySelectorAll("[data-reveal]"));
    if (!elements.length) return;

    elements.forEach(function (el) {
      var y = el.getAttribute("data-reveal-y");
      var delay = el.getAttribute("data-reveal-delay");
      if (y) el.style.setProperty("--reveal-y", y + "px");
      if (delay) el.style.setProperty("--reveal-delay", delay + "ms");
    });

    if (!("IntersectionObserver" in window)) {
      elements.forEach(function (el) {
        el.classList.add("is-revealed");
      });
      return;
    }

    var observer = new IntersectionObserver(
      function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-revealed");
            observer.unobserve(entry.target);
          }
        });
      },
      { threshold: 0.15, rootMargin: "0px 0px -10% 0px" }
    );

    elements.forEach(function (el) {
      observer.observe(el);
    });
  })();
</script>
